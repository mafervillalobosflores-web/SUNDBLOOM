<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Administración | SUNDBLOOM</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="announcement">SUNDBLOOM · PANEL DE ADMINISTRACIÓN</div><main class="admin-body"><a class="back-link" href="index.html">← Volver a la tienda</a><h1>Administrar prendas</h1>
<section class="admin-card" id="login-card"><h2>Ingresar como administradora</h2><p class="notice">Inicia sesión con el correo y la contraseña que registraste en Supabase.</p><form class="admin-form" id="login-form"><label>Correo electrónico<input id="login-email" type="email" autocomplete="username" required></label><label>Contraseña<input id="login-password" type="password" autocomplete="current-password" required></label><button class="wide" type="submit">INICIAR SESIÓN</button></form><p id="login-message" role="status"></p></section>
<div id="admin-content" hidden><p class="notice">Los productos y sus fotos se guardan en Supabase y se muestran en la tienda.</p><button type="button" id="logout-button">CERRAR SESIÓN</button>
<div class="admin-card"><h2>Nueva prenda</h2><form class="admin-form" id="product-form"><label>Nombre de la prenda<input id="product-name" required maxlength="80" placeholder="Ej. Top básico negro"></label><label>Precio (S/)<input id="product-price" required type="number" min="0.01" step="0.01" placeholder="59.00"></label><label>Categoría<select id="product-category"><option value="tops">Tops</option><option value="casual">Casual</option><option value="street">Street</option></select></label><label class="wide">Foto de la prenda<input id="product-image" type="file" accept="image/jpeg,image/png,image/webp,image/avif" required></label><button class="wide" type="submit">PUBLICAR PRENDA</button></form><p id="admin-message" role="status"></p></div>
<div class="admin-card"><h2>Prendas publicadas</h2><div class="admin-products" id="admin-products"></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
